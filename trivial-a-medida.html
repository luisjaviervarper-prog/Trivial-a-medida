<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  :root{
    --red:#DA291C;
    --red-dark:#A31E14;
    --red-soft:#F7DAD6;
    --ink:#313131;
    --gray:#8B8B8D;
    --gray-line:#D8DBDC;
    --gray-bg:#F1F3F4;
    --white:#FFFFFF;
    --steel:#3E5C6B;
    --success:#2E7D46;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;
    --pill:999px;
    --shadow-card:0 2px 14px rgba(49,49,49,0.10);
    --shadow-soft:0 2px 6px rgba(49,49,49,0.14);
    --font-display:'Open Sans',system-ui,sans-serif;
    --font-body:'Open Sans',system-ui,sans-serif;
    --font-mono:'Open Sans',system-ui,sans-serif;
  }
  body{
    background:var(--white);
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:22px 16px calc(48px + env(safe-area-inset-bottom));
    min-height:100vh;
    position:relative;
  }
  :focus-visible{ outline:3px solid var(--red); outline-offset:2px; }

  /* ---- top bar / typography ---- */
  .cover-hero{ display:flex; justify-content:center; margin:-2px 0 10px; }
  .cover-hero-svg{ width:100%; max-width:280px; height:auto; overflow:visible; }
  .cover-hero-svg text{ font-family:var(--font-display); font-weight:700; }
  .floaty{
    font-size:32px; paint-order:stroke fill; stroke-linejoin:round; stroke-width:2px;
    transform-box:fill-box; transform-origin:center; transform:rotate(var(--rot,0deg));
  }
  .q-mostaza{ fill:var(--red); stroke:var(--red-dark); }
  .q-frambuesa{ fill:var(--steel); stroke:#28414c; }
  .q-teal{ fill:var(--gray); stroke:#6d6d6f; }
  .q-indigo{ fill:var(--red-dark); stroke:#6e140c; }
  .bubble-q{ font-size:28px; fill:var(--ink); }
  @media (prefers-reduced-motion: no-preference){
    .floaty{ animation:floatBob 3.2s ease-in-out infinite; }
    .floaty.f2{ animation-delay:.4s; }
    .floaty.f3{ animation-delay:.8s; }
    .floaty.f4{ animation-delay:1.2s; }
    @keyframes floatBob{
      0%,100%{ transform:rotate(var(--rot,0deg)) translateY(0); }
      50%{ transform:rotate(var(--rot,0deg)) translateY(-6px); }
    }
  }
  .topbar{ display:flex; align-items:flex-start; gap:10px; margin-bottom:18px; }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--red); margin-bottom:6px; font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; display:inline-block; width:22px; height:2px; background:var(--red); }
  .brand{ font-family:var(--font-display); font-weight:800; font-size:clamp(26px,7vw,34px); margin:0; line-height:1.08; color:var(--ink); }
  .brand-sm{ font-family:var(--font-display); font-weight:800; font-size:clamp(20px,6vw,26px); margin:0; line-height:1.15; color:var(--ink); }
  .section-label{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--gray); font-weight:700; margin:24px 2px 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::before{ content:''; display:inline-block; width:16px; height:2px; background:var(--gray-line); }
  .hint{ font-size:13px; color:var(--gray); margin:6px 2px 0; }
  .hint-error{ color:var(--red-dark); }
  .footnote{ font-size:12px; color:var(--gray); text-align:center; margin-top:22px; }
  .back-btn{ margin-top:2px; }

  /* ---- buttons ---- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; border:none; border-radius:var(--pill);
    font-family:var(--font-display); font-weight:700; font-size:15px;
    padding:14px 18px; cursor:pointer; margin-top:12px;
    transition:transform .12s ease, filter .12s ease, background .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--red); color:var(--white); }
  .btn-primary:not(:disabled):hover{ background:var(--red-dark); }
  .btn-ghost{ background:var(--white); color:var(--red); border:1.5px solid var(--red); }
  .btn-ghost:not(:disabled):hover{ background:var(--red-soft); }
  .btn-success{ background:var(--success); color:var(--white); }
  .btn-danger{ background:var(--ink); color:var(--white); }
  .btn-import{ background:var(--white); color:var(--red); border:1.5px dashed var(--red); margin-top:18px; }
  .plus{ font-size:20px; line-height:1; }
  .link-btn{
    display:block; width:100%; text-align:center; background:none; border:none;
    color:var(--gray); font-size:13px; text-decoration:underline; padding:10px 0 0; cursor:pointer;
  }
  .icon-btn{
    width:36px; height:36px; min-width:36px; border-radius:50%; border:1.5px solid var(--gray-line);
    background:var(--white); color:var(--ink); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:disabled{ opacity:.3; }

  /* ---- deck list (home) ---- */
  .deck-list{ display:flex; flex-direction:column; gap:10px; }
  .deck-card{
    display:flex; align-items:center; gap:12px; background:var(--white); color:var(--ink);
    border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow-card); cursor:pointer;
    border:1px solid var(--gray-line); text-align:left; width:100%; position:relative; overflow:hidden;
  }
  .deck-card:active{ transform:scale(.985); }
  .deck-tab{ width:5px; align-self:stretch; border-radius:4px; background:var(--red); flex-shrink:0; }
  .deck-info{ flex:1; min-width:0; }
  .deck-name{ font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink); }
  .deck-meta{ font-family:var(--font-mono); font-size:11.5px; color:var(--gray); margin-top:3px; }
  .deck-actions{ display:flex; gap:6px; }
  .deck-actions .icon-btn{ width:30px; height:30px; min-width:30px; font-size:14px; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--gray); }
  .empty-icon{ font-size:34px; margin-bottom:8px; }

  /* ---- banners ---- */
  .error-banner, .notice-banner{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; margin-bottom:14px;
  }
  .error-banner{ background:var(--red-soft); border:1px solid var(--red); color:var(--red-dark); }
  .notice-banner{ background:var(--gray-bg); border:1px solid var(--gray-line); color:var(--ink); }
  .error-banner .link-btn, .notice-banner .link-btn{ width:auto; padding:0; margin:0; color:inherit; }

  /* ---- chips / setup controls ---- */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--gray-line); background:var(--white); color:var(--ink);
    border-radius:var(--pill); padding:8px 14px; font-family:var(--font-mono); font-size:13px; cursor:pointer;
  }
  .level-chip{ border-color:var(--chip-color, var(--steel)); color:var(--chip-color, var(--steel)); font-weight:700; }
  .level-chip.active{ background:var(--chip-color, var(--steel)); color:var(--white); border-color:transparent; }
  .mode-row{ display:flex; gap:10px; }
  .mode-tile{
    flex:1; padding:16px 10px; border-radius:var(--radius-md); border:1.5px solid var(--gray-line);
    background:var(--white); color:var(--ink); font-family:var(--font-display); font-weight:700;
    font-size:15px; cursor:pointer;
  }

  /* ---- flip cards (signature moment) ---- */
  .flip-row{ display:flex; gap:14px; perspective:1000px; }

  /* ---- end screen ---- */

  .results-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }

</style>
</head>
<body>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
<div id="app"></div>

<script>
/* ================= estado ================= */
let state = {
  screen:'home',
  datasetsIndex:[],
  currentDataset:null,
  usedIds:[],
  levelColors:{},
  config:{ levels:[], mode:'equipos', teams:[{name:'Equipo 1'},{name:'Equipo 2'}], questionsPerTeam:10 },
  game:null,
  loading:true,
  error:null,
  notice:null,
  showFormatInfo:false,
  namePromptOpen:false,
  pendingImport:null,
  confirmDelete:null,
  confirmQuit:false,
};

const PALETTE = ['#DA291C','#3E5C6B','#8B8B8D','#A31E14','#5B6B72','#C98B2E'];
const TEAM_COLORS = PALETTE;

/* ================= almacenamiento persistente ================= */
const hasStorage = !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
const memoryStore = new Map();

async function storageGet(key){
  if (hasStorage){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  return memoryStore.has(key) ? memoryStore.get(key) : null;
}
async function storageSet(key, value){
  if (hasStorage){
    try{ await window.storage.set(key, value, false); return true; }
    catch(e){ return false; }
  }
  memoryStore.set(key, value);
  return true;
}
async function storageDelete(key){
  if (hasStorage){
    try{ await window.storage.delete(key, false); return true; }
    catch(e){ return false; }
  }
  memoryStore.delete(key);
  return true;
}
function hasStorageNote(){
  return hasStorage
    ? 'Tus mazos y tu progreso se guardan automáticamente en tu cuenta.'
    : 'Este navegador no admite guardado permanente: tus mazos se perderán al cerrar esta ventana.';
}

/* ================= utilidades ================= */
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffleArray(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function formatDate(ts){
  try{ return new Intl.DateTimeFormat('es-ES', {day:'numeric', month:'short', year:'numeric'}).format(new Date(ts)); }
  catch(e){ return ''; }
}
function buildLevelColors(levels){
  const map = {};
  levels.forEach((l, i) => { map[l] = PALETTE[i % PALETTE.length]; });
  return map;
}
function topicColor(t){
  let h = 0;
  for (let i = 0; i < t.length; i++){ h = (h * 31 + t.charCodeAt(i)) >>> 0; }
  return PALETTE[h % PALETTE.length];
}
function normalizeHeader(h){
  return String(h ?? '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* ================= lectura de excel/csv ================= */
async function parseWorkbookFile(file){
  const name = file.name.toLowerCase();
  let workbook;
  if (name.endsWith('.csv')){
    const text = await file.text();
    workbook = XLSX.read(text, {type:'string'});
  } else {
    const buf = await file.arrayBuffer();
    workbook = XLSX.read(buf, {type:'array'});
  }
  const sheetName = workbook.SheetNames[0];
  if (!sheetName) throw new Error('El archivo no contiene ninguna hoja.');
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if (!rows.length) throw new Error('El archivo está vacío.');

  let headerIdx = 0;
  while (headerIdx < rows.length && rows[headerIdx].every(c => String(c).trim() === '')) headerIdx++;
  if (headerIdx >= rows.length) throw new Error('El archivo está vacío.');

  const header = rows[headerIdx].map(normalizeHeader);
  const col = { nivel:-1, tema:-1, pregunta:-1, respuesta:-1 };
  header.forEach((h, i) => {
    if (col.nivel === -1 && h.includes('nivel')) col.nivel = i;
    else if (col.tema === -1 && h.includes('tema')) col.tema = i;
    else if (col.pregunta === -1 && h.includes('pregunta')) col.pregunta = i;
    else if (col.respuesta === -1 && h.includes('respuesta')) col.respuesta = i;
  });
  if (col.nivel === -1 || col.tema === -1 || col.pregunta === -1 || col.respuesta === -1){
    throw new Error('No se han encontrado las columnas Nivel, Tema, Pregunta y Respuesta en la primera fila con datos.');
  }

  const questions = [];
  for (let r = headerIdx + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row || row.every(c => String(c).trim() === '')) continue;
    const pregunta = String(row[col.pregunta] ?? '').trim();
    const respuesta = String(row[col.respuesta] ?? '').trim();
    if (!pregunta || !respuesta) continue;
    const nivel = String(row[col.nivel] ?? '').trim() || 'Sin nivel';
    const tema = String(row[col.tema] ?? '').trim() || 'General';
    questions.push({ id:'q' + r + '_' + Math.random().toString(36).slice(2, 8), nivel, tema, pregunta, respuesta });
  }
  if (!questions.length) throw new Error('No se ha encontrado ninguna pregunta válida (revisa que Pregunta y Respuesta no estén vacías).');
  return questions;
}

/* ================= gestión de mazos (datasets) ================= */
async function handleFileImport(file){
  state.loading = true; state.error = null; render();
  try{
    const questions = await parseWorkbookFile(file);
    state.loading = false;
    state.pendingImport = { questions, fileName:file.name, suggestedName:file.name.replace(/\.[^.]+$/, '') };
    state.namePromptOpen = true;
    render();
  }catch(err){
    state.loading = false;
    state.error = err.message || 'No se ha podido leer el archivo.';
    render();
  }
}
function confirmDatasetName(){
  const input = document.getElementById('datasetNameInput');
  const name = (input && input.value.trim()) || state.pendingImport.suggestedName || 'Mazo sin nombre';
  saveNewDataset(name, state.pendingImport.questions);
}
async function saveNewDataset(name, questions){
  state.namePromptOpen = false;
  state.loading = true; render();
  const id = 'ds_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  await storageSet('dataset-questions-' + id, JSON.stringify(questions));
  await storageSet('dataset-used-' + id, JSON.stringify([]));
  const entry = { id, name, createdAt: Date.now(), count: questions.length };
  state.datasetsIndex.push(entry);
  await storageSet('datasets-index', JSON.stringify(state.datasetsIndex));
  state.pendingImport = null;
  state.loading = false;
  await selectDataset(id);
}
async function selectDataset(id){
  state.loading = true; render();
  const meta = state.datasetsIndex.find(d => d.id === id);
  const qRaw = await storageGet('dataset-questions-' + id);
  const uRaw = await storageGet('dataset-used-' + id);
  const questions = qRaw ? JSON.parse(qRaw) : [];
  const usedIds = uRaw ? JSON.parse(uRaw) : [];
  const levels = [...new Set(questions.map(q => q.nivel))];
  state.currentDataset = { id, name: meta ? meta.name : 'Mazo', questions };
  state.usedIds = usedIds;
  state.levelColors = buildLevelColors(levels);
  state.config = { levels:[...levels], mode:'equipos', teams:[{name:'Equipo 1'},{name:'Equipo 2'}], questionsPerTeam:10 };
  state.loading = false;
  state.screen = 'setup';
  render();
}
async function deleteDataset(id){
  state.confirmDelete = null;
  state.datasetsIndex = state.datasetsIndex.filter(d => d.id !== id);
  await storageSet('datasets-index', JSON.stringify(state.datasetsIndex));
  await storageDelete('dataset-questions-' + id);
  await storageDelete('dataset-used-' + id);
  if (state.currentDataset && state.currentDataset.id === id){ state.currentDataset = null; state.screen = 'home'; }
  render();
}
async function resetProgress(id){
  await storageSet('dataset-used-' + id, JSON.stringify([]));
  if (state.currentDataset && state.currentDataset.id === id) state.usedIds = [];
  state.notice = 'Progreso reiniciado: se podrán repetir todas las preguntas.';
  render();
}

/* ================= lógica de partida ================= */
function getPool(){
  return state.currentDataset.questions.filter(q => state.config.levels.includes(q.nivel));
}
function getUnusedPool(pool){
  return pool.filter(q => !state.usedIds.includes(q.id));
}
function maybeResetCycle(pool){
  if (!pool.length) return;
  const usedCount = pool.filter(q => state.usedIds.includes(q.id)).length;
  const ratio = usedCount / pool.length;
  if (ratio >= 0.6 || usedCount === pool.length){
    const poolIds = new Set(pool.map(q => q.id));
    state.usedIds = state.usedIds.filter(id => !poolIds.has(id));
  }
}
function pickTopics(){
  const pool = getPool();
  maybeResetCycle(pool);
  const unused = getUnusedPool(pool);
  const source = unused.length ? unused : pool;
  const topics = shuffleArray([...new Set(source.map(q => q.tema))]);
  return topics.slice(0, 2);
}
function pickQuestionForTopic(tema){
  const pool = getPool().filter(q => q.tema === tema);
  const unused = getUnusedPool(pool);
  const source = unused.length ? unused : pool;
  return source[Math.floor(Math.random() * source.length)];
}
function nextTeamIndex(from){
  const n = state.game.teams.length;
  for (let step = 1; step <= n; step++){
    const idx = (from + step) % n;
    if (state.game.teams[idx].asked < state.game.target) return idx;
  }
  return -1;
}
function startTurn(){
  const topics = pickTopics();
  if (!topics.length){ finishGame(); return; }
  if (topics.length === 1){
    state.game.phase = 'question';
    state.game.topicChoices = topics;
    state.game.currentQuestion = pickQuestionForTopic(topics[0]);
  } else {
    state.game.phase = 'choose';
    state.game.topicChoices = topics;
    state.game.currentQuestion = null;
  }
  render();
}
function chooseTopic(tema){
  state.game.currentQuestion = pickQuestionForTopic(tema);
  state.game.phase = 'question';
  render();
}
async function markResult(correct){
  const team = state.game.teams[state.game.turnIndex];
  team.asked++;
  if (correct) team.score++;
  const qid = state.game.currentQuestion.id;
  if (!state.usedIds.includes(qid)) state.usedIds.push(qid);
  await storageSet('dataset-used-' + state.currentDataset.id, JSON.stringify(state.usedIds));
  const next = nextTeamIndex(state.game.turnIndex);
  if (next === -1){ finishGame(); return; }
  state.game.turnIndex = next;
  startTurn();
}
function finishGame(){
  state.game.finished = true;
  state.screen = 'end';
  render();
}
function startGame(){
  const mode = state.config.mode;
  const teams = mode === 'solo'
    ? [{ name:'Tú', score:0, asked:0 }]
    : state.config.teams.map(t => ({ name:(t.name || '').trim() || 'Equipo', score:0, asked:0 }));
  state.game = {
    teams, turnIndex:0, phase:'choose', topicChoices:[], currentQuestion:null, finished:false,
    target: state.config.questionsPerTeam,
  };
  state.screen = 'play';
  startTurn();
}
function restartGame(){
  state.game.teams.forEach(t => { t.score = 0; t.asked = 0; });
  state.game.turnIndex = 0;
  state.game.finished = false;
  state.screen = 'play';
  startTurn();
}

/* ================= render: pantallas ================= */
function heroMascotSVG(){
  return `
  <div class="cover-hero">

      <text x="30" y="55" class="floaty q-mostaza f1" style="--rot:-14deg">?</text>
      <text x="345" y="100" class="floaty q-frambuesa f2" style="--rot:12deg">?</text>
      <text x="25" y="228" class="floaty q-teal f3" style="--rot:9deg">?</text>
      <text x="330" y="222" class="floaty q-indigo f4" style="--rot:-8deg">?</text>

      <ellipse cx="206" cy="193" rx="25" ry="21" fill="#DA291C" stroke="#A31E14" stroke-width="2.5"/>
      <ellipse cx="150" cy="155" rx="75" ry="68" fill="#F1F3F4" stroke="#DA291C" stroke-width="3"/>

      <ellipse cx="128" cy="128" rx="8.5" ry="10.5" fill="#313131"/>
      <ellipse cx="168" cy="126" rx="8.5" ry="10.5" fill="#313131"/>
      <circle cx="131" cy="124" r="2.4" fill="#fff"/>
      <circle cx="171" cy="122" r="2.4" fill="#fff"/>
      <path d="M 136 162 Q 150 168 162 160" fill="none" stroke="#313131" stroke-width="3.5" stroke-linecap="round"/>

      <circle cx="196" cy="90" r="7" fill="#FFFFFF" stroke="#8B8B8D" stroke-width="2"/>
      <circle cx="216" cy="65" r="11" fill="#FFFFFF" stroke="#8B8B8D" stroke-width="2.5"/>
      <circle cx="253" cy="32" r="27" fill="#FFFFFF" stroke="#DA291C" stroke-width="3"/>
      <text x="253" y="43" text-anchor="middle" class="bubble-q">?</text>
    </svg>
  </div>`;
}
function renderHome(){
  const hasDatasets = state.datasetsIndex.length > 0;
  return `
    ${heroMascotSVG()}
    <div class="topbar">
      <div>
        <div class="eyebrow">Tu juego de preguntas</div>
        <h1 class="brand">Trivial a medida</h1>
      </div>
    </div>
    ${state.error ? `<div class="error-banner">${esc(state.error)} <button class="link-btn" data-action="close-modal">Cerrar</button></div>` : ''}
    ${state.notice ? `<div class="notice-banner">${esc(state.notice)} <button class="link-btn" data-action="close-notice">Cerrar</button></div>` : ''}
    <div class="section-label">Tus mazos</div>
    <div class="deck-list">
      ${hasDatasets ? state.datasetsIndex.map(datasetCard).join('') : emptyState()}
    </div>
    <button class="btn btn-import" data-action="import-click"><span class="plus">+</span> Añadir mazo desde Excel o CSV</button>
    <button class="link-btn" data-action="open-format-info">¿Qué formato debe tener el archivo?</button>
    <p class="footnote">${hasStorageNote()}</p>
    ${state.showFormatInfo ? formatInfoModal() : ''}
    ${state.namePromptOpen ? namePromptModal() : ''}
    ${state.confirmDelete ? confirmDeleteModal() : ''}
    ${state.loading ? loadingOverlay() : ''}
  `;
}
function datasetCard(d){
  return `
    <div class="deck-card" data-action="select-dataset" data-id="${d.id}" role="button" tabindex="0">
      <div class="deck-tab"></div>
      <div class="deck-info">
        <div class="deck-name">${esc(d.name)}</div>
        <div class="deck-meta">${d.count} preguntas · importado ${formatDate(d.createdAt)}</div>
      </div>
      <div class="deck-actions">
        <button class="icon-btn" data-action="reset-progress" data-id="${d.id}" title="Reiniciar progreso">↺</button>
        <button class="icon-btn" data-action="delete-dataset" data-id="${d.id}" title="Eliminar">✕</button>
      </div>
    </div>`;
}
function emptyState(){
  return `<div class="empty-state">
    <div class="empty-icon">🗂️</div>
    <p>Aún no has importado ningún archivo.<br>Sube un Excel o CSV con tus preguntas para crear tu primer mazo.</p>
  </div>`;
}
function formatInfoModal(){
  return modalWrapper(`
    <h2>Formato del archivo</h2>
    <p>El Excel o CSV debe tener estas 4 columnas en la primera fila con datos (el orden no importa, pero los nombres sí):</p>
    <table class="sample-table">
      <thead><tr><th>Nivel</th><th>Tema</th><th>Pregunta</th><th>Respuesta</th></tr></thead>
      <tbody>
        <tr><td>1</td><td>Verbos</td><td>¿Cómo se dice "comer"?</td><td>To eat</td></tr>
        <tr><td>1</td><td>Comida</td><td>¿Cómo se dice "manzana"?</td><td>Apple</td></tr>
        <tr><td>2</td><td>Verbos</td><td>Pasado de "go"</td><td>Went</td></tr>
      </tbody>
    </table>
    <ul class="tips">
      <li>Se usa la primera hoja del archivo.</li>
      <li>Los niveles pueden llamarse como quieras: 1, 2, 3… o A1, B2…</li>
      <li>Las filas vacías o sin pregunta/respuesta se ignoran.</li>
      <li>Puedes importar tantos archivos como quieras: cada uno será un mazo con su propio nombre, y podrás elegir entre ellos.</li>
    </ul>
    <button class="btn btn-primary" data-action="close-modal">Entendido</button>
  `);
}
function namePromptModal(){
  const p = state.pendingImport;
  return modalWrapper(`
    <h2>Nombra este mazo</h2>
    <p>${p.questions.length} preguntas detectadas en <strong>${esc(p.fileName)}</strong>. Este nombre te servirá luego para elegir entre tus mazos importados.</p>
    <input type="text" id="datasetNameInput" class="text-input" value="${esc(p.suggestedName)}" maxlength="40">
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="cancel-import">Cancelar</button>
      <button class="btn btn-primary" data-action="confirm-import">Guardar mazo</button>
    </div>
  `);
}
function confirmDeleteModal(){
  const d = state.datasetsIndex.find(x => x.id === state.confirmDelete);
  return modalWrapper(`
    <h2>Eliminar mazo</h2>
    <p>¿Seguro que quieres eliminar <strong>${esc(d ? d.name : '')}</strong>? Se perderán sus preguntas y su progreso.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="confirm-delete-no">Cancelar</button>
      <button class="btn btn-danger" data-action="confirm-delete-yes">Eliminar</button>
    </div>
  `);
}
function loadingOverlay(){
  return `<div class="loading-overlay"><div class="spinner"></div></div>`;
}
function modalWrapper(inner){
  return `<div class="modal-overlay"><div class="modal">${inner}</div></div>`;
}

function renderSetup(){
  const ds = state.currentDataset;
  const allLevels = [...new Set(ds.questions.map(q => q.nivel))];
  const pool = getPool();
  const teamsOk = state.config.mode === 'solo' || state.config.teams.length >= 2;
  const canStart = state.config.levels.length > 0 && pool.length > 0 && teamsOk;
  return `
    <div class="topbar">
      <button class="icon-btn back-btn" data-action="go-home">←</button>
      <div><div class="eyebrow">${esc(ds.name)}</div><h1 class="brand-sm">Configura la partida</h1></div>
    </div>

    <div class="section-label">Niveles a incluir</div>
    <div class="chip-row">
      ${allLevels.map(l => `<button class="chip level-chip ${state.config.levels.includes(l) ? 'active' : ''}" style="--chip-color:${esc(state.levelColors[l] || '#5B5FA8')}" data-action="toggle-level" data-level="${esc(l)}">${esc(l)}</button>`).join('')}
    </div>
    ${pool.length === 0
      ? '<p class="hint hint-error">No hay preguntas para los niveles seleccionados.</p>'
      : `<p class="hint">${pool.length} preguntas disponibles con estos niveles.</p>`}

    <div class="section-label">Modo de juego</div>
    <div class="mode-row">
      <button class="mode-tile ${state.config.mode === 'solo' ? 'active' : ''}" data-action="set-mode" data-mode="solo">🧑 Solo</button>
      <button class="mode-tile ${state.config.mode === 'equipos' ? 'active' : ''}" data-action="set-mode" data-mode="equipos">👥 Equipos</button>
    </div>
    ${state.config.mode === 'equipos' ? teamsEditor() : ''}
    ${state.config.mode === 'equipos' && state.config.teams.length < 2 ? '<p class="hint hint-error">Necesitas al menos 2 equipos.</p>' : ''}

    <div class="section-label">Preguntas por ${state.config.mode === 'solo' ? 'jugador' : 'equipo'}</div>
    <div class="qcount-row">
      ${[10, 20, 30].map(n => `<button class="qcount-tile ${state.config.questionsPerTeam === n ? 'active' : ''}" data-action="set-qcount" data-n="${n}">${n}</button>`).join('')}
    </div>

    <button class="btn btn-primary btn-start" data-action="start-game" ${canStart ? '' : 'disabled'}>Empezar partida</button>
    ${state.loading ? loadingOverlay() : ''}
  `;
}
function teamsEditor(){
  return `
    <div class="teams-editor">
      <div class="stepper">
        <button class="icon-btn" data-action="teams-dec" ${state.config.teams.length <= 2 ? 'disabled' : ''}>−</button>
        <span class="stepper-value">${state.config.teams.length} equipos</span>
        <button class="icon-btn" data-action="teams-inc" ${state.config.teams.length >= 6 ? 'disabled' : ''}>+</button>
      </div>
      <div class="team-names">
        ${state.config.teams.map((t, i) => `<input class="text-input team-name-input" data-role="team-name" data-index="${i}" value="${esc(t.name)}" maxlength="24" style="--team-color:${TEAM_COLORS[i % TEAM_COLORS.length]}">`).join('')}
      </div>
    </div>`;
}

function renderPlay(){
  const g = state.game;
  const teamsHtml = g.teams.map((t, i) => `
    <div class="team-chip ${i === g.turnIndex ? 'current' : ''}" style="--team-color:${TEAM_COLORS[i % TEAM_COLORS.length]}">
      <span class="team-chip-name">${esc(t.name)}</span>
      <span>${t.score} aciertos · ${t.asked}/${g.target}</span>
    </div>`).join('');

  let phaseHtml = '';
  if (g.phase === 'choose'){
    phaseHtml = `
      <div class="turn-banner">Turno de <strong>${esc(g.teams[g.turnIndex].name)}</strong></div>
      <div class="choose-title">Elige un tema</div>
      <div class="flip-row">
        ${g.topicChoices.map((t, i) => `
          <button class="flip-card" style="--tc:${topicColor(t)}; --delay:${i * 140}ms" data-action="choose-topic" data-tema="${esc(t)}">
            <span class="flip-card-inner">${esc(t)}</span>
          </button>`).join('')}
      </div>`;
  } else {
    const q = g.currentQuestion;
    phaseHtml = `
      <div class="turn-banner">Turno de <strong>${esc(g.teams[g.turnIndex].name)}</strong></div>
      <div class="qa-card">
        <div class="qa-tabs">
          <span class="qa-tab" style="--tc:${esc(state.levelColors[q.nivel] || '#5B5FA8')}">Nivel ${esc(q.nivel)}</span>
          <span class="qa-tab qa-tab-mono">${esc(q.tema)}</span>
        </div>
        <div class="qa-question">${esc(q.pregunta)}</div>
        ${g.phase === 'question'
          ? `<button class="btn btn-primary" data-action="reveal-answer">Mostrar respuesta</button>`
          : `
            <div class="qa-divider"></div>
            <div class="qa-answer">${esc(q.respuesta)}</div>
            <div class="qa-result-row">
              <button class="btn btn-success" data-action="mark-correct">✅ Acertó</button>
              <button class="btn btn-danger" data-action="mark-wrong">❌ Falló</button>
            </div>`}
      </div>`;
  }

  return `
    <div class="topbar">
      <button class="icon-btn back-btn" data-action="quit-game">←</button>
      <div class="eyebrow">${esc(state.currentDataset.name)}</div>
    </div>
    <div class="team-chip-row">${teamsHtml}</div>
    ${phaseHtml}
    ${state.confirmQuit ? confirmQuitModal() : ''}
  `;
}
function confirmQuitModal(){
  return modalWrapper(`
    <h2>Abandonar partida</h2>
    <p>Se perderá el marcador de esta partida (tu progreso de preguntas ya vistas se conserva). ¿Seguro que quieres salir?</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="confirm-quit-no">Seguir jugando</button>
      <button class="btn btn-danger" data-action="confirm-quit-yes">Salir</button>
    </div>
  `);
}

function renderEnd(){
  const g = state.game;
  const teams = [...g.teams].sort((a, b) => b.score - a.score);
  const topScore = teams[0].score;
  const winners = teams.filter(t => t.score === topScore);
  const bannerHtml = state.config.mode === 'solo'
    ? `<div class="winner-title">Has acertado ${teams[0].score} de ${teams[0].asked}</div>`
    : winners.length > 1
      ? `<div class="winner-title">🤝 Empate entre ${winners.map(w => esc(w.name)).join(' y ')}</div>`
      : `<div class="winner-title">🏆 ¡Gana ${esc(winners[0].name)}!</div>`;
  return `
    <div class="topbar"><div><div class="eyebrow">${esc(state.currentDataset.name)}</div><h1 class="brand-sm">Resultados</h1></div></div>
    <div class="winner-banner">${bannerHtml}</div>
    <div class="results-list">
      ${teams.map((t, i) => `
        <div class="result-row" style="--team-color:${TEAM_COLORS[g.teams.indexOf(t) % TEAM_COLORS.length]}">
          <span class="result-rank">${i + 1}</span>
          <span class="result-name">${esc(t.name)}</span>
          <span class="result-score">${t.score}/${t.asked}</span>
        </div>`).join('')}
    </div>
    <button class="btn btn-primary" data-action="play-again">Jugar otra vez</button>
    <button class="btn btn-ghost" data-action="go-home">Elegir otro mazo</button>
  `;
}

const screens = { home: renderHome, setup: renderSetup, play: renderPlay, end: renderEnd };
const appEl = document.getElementById('app');
function render(){ appEl.innerHTML = screens[state.screen](); }

/* ================= manejadores de acciones ================= */
const handlers = {
  'import-click': () => document.getElementById('fileInput').click(),
  'select-dataset': (el) => selectDataset(el.dataset.id),
  'delete-dataset': (el) => { state.confirmDelete = el.dataset.id; render(); },
  'confirm-delete-yes': () => deleteDataset(state.confirmDelete),
  'confirm-delete-no': () => { state.confirmDelete = null; render(); },
  'reset-progress': (el) => resetProgress(el.dataset.id),
  'go-home': () => { state.screen = 'home'; state.error = null; render(); },
  'close-modal': () => { state.showFormatInfo = false; state.error = null; render(); },
  'close-notice': () => { state.notice = null; render(); },
  'open-format-info': () => { state.showFormatInfo = true; render(); },
  'cancel-import': () => { state.namePromptOpen = false; state.pendingImport = null; render(); },
  'confirm-import': () => confirmDatasetName(),
  'toggle-level': (el) => {
    const lvl = el.dataset.level;
    const idx = state.config.levels.indexOf(lvl);
    if (idx >= 0) state.config.levels.splice(idx, 1); else state.config.levels.push(lvl);
    render();
  },
  'set-mode': (el) => { state.config.mode = el.dataset.mode; render(); },
  'teams-inc': () => { if (state.config.teams.length < 6){ state.config.teams.push({ name:'Equipo ' + (state.config.teams.length + 1) }); render(); } },
  'teams-dec': () => { if (state.config.teams.length > 2){ state.config.teams.pop(); render(); } },
  'set-qcount': (el) => { state.config.questionsPerTeam = Number(el.dataset.n); render(); },
  'start-game': () => startGame(),
  'choose-topic': (el) => chooseTopic(el.dataset.tema),
  'reveal-answer': () => { state.game.phase = 'answer'; render(); },
  'mark-correct': () => markResult(true),
  'mark-wrong': () => markResult(false),
  'play-again': () => restartGame(),
  'quit-game': () => { state.confirmQuit = true; render(); },
  'confirm-quit-yes': () => { state.confirmQuit = false; state.screen = 'home'; render(); },
  'confirm-quit-no': () => { state.confirmQuit = false; render(); },
};

appEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = handlers[el.dataset.action];
  if (fn) fn(el, e);
});
appEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
  e.preventDefault();
  const fn = handlers[el.dataset.action];
  if (fn) fn(el, e);
});
appEl.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.role === 'team-name'){
    const idx = Number(el.dataset.index);
    if (state.config.teams[idx]) state.config.teams[idx].name = el.value;
  }
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  await handleFileImport(file);
});

/* ================= arranque ================= */
async function init(){
  state.loading = true; render();
  try{
    const idxRaw = await storageGet('datasets-index');
    state.datasetsIndex = idxRaw ? JSON.parse(idxRaw) : [];
  }catch(e){ state.datasetsIndex = []; }
  state.loading = false;
  render();
}
init();
</script>
</body>
</html>
